# project.yml — `xcodegen` regenerates Cans.xcodeproj from this file.
name: Cans
options:
  bundleIdPrefix: app.cans
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.0"
targets:
  Cans:
    type: application
    platform: macOS
    configFiles:
      Debug: Configuration/Debug.xcconfig
    sources: [Sources, Resources]
    info:
      path: Configuration/Info.plist
      properties:
        CFBundleDisplayName: Cans
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "14.0"
        NSBluetoothAlwaysUsageDescription: Cans uses Bluetooth to read and change your Sony headphone settings.
        NSHumanReadableCopyright: "MIT License. Based on XM5 Control by Maadlou."
        # Sparkle: the release workflow attaches appcast.xml, signed with this key's private half.
        SUFeedURL: https://github.com/unhingedpanda/cans/releases/latest/download/appcast.xml
        SUPublicEDKey: MPbJcviNyiA2pr+Q/iJ2Gh+xAdIOG+Rb9YPbhOpkFCg=
        SUEnableAutomaticChecks: true
    # Not sandboxed: distributed outside the App Store, and reading the system Now Playing
    # needs Apple's perl host (see NowPlayingHelper), which the sandbox would block.
    entitlements:
      path: Configuration/Cans.entitlements
      properties:
        # Ad-hoc signing has no Team ID, so the hardened runtime would refuse to load the embedded
        # Sparkle.framework. Drop this once a Developer ID signs the app and Sparkle as one team.
        com.apple.security.cs.disable-library-validation: true
    dependencies:
      - package: Sparkle
      - target: CansNowPlaying
        link: false  # only perl loads it; Cans itself never links it
        embed: true
        copy:
          destination: frameworks
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cans.mac
        PRODUCT_MODULE_NAME: Cans
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        DEAD_CODE_STRIPPING: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG MENU_BAR_APP
        Release:
          # Ad-hoc until a Developer ID exists; scripts/release.sh signs the same way.
          CODE_SIGN_IDENTITY: "-"
          ENABLE_HARDENED_RUNTIME: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: MENU_BAR_APP
          SWIFT_COMPILATION_MODE: wholemodule
  CansNowPlaying:
    type: library.dynamic
    platform: macOS
    sources: [NowPlayingHelper]
    dependencies:
      - sdk: Foundation.framework
    settings:
      base:
        PRODUCT_NAME: CansNowPlaying
        EXECUTABLE_PREFIX: lib
        CLANG_ENABLE_OBJC_ARC: YES
        SKIP_INSTALL: YES
  CansTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: Cans
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_MODULE_NAME: CansTests
  CansHardwareTests:
    type: bundle.unit-test
    platform: macOS
    sources: [HardwareTests]
    dependencies:
      - target: Cans
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_MODULE_NAME: CansHardwareTests
  CansUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: Cans
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_MODULE_NAME: CansUITests
        # XCUIApplication is @MainActor in Xcode 16's SDK; UI tests drive it synchronously, so they
        # stay in Swift 5 mode (strict concurrency checks would reject every call on CI's Xcode).
        SWIFT_VERSION: "5.0"
schemes:
  Cans:
    build:
      targets: { Cans: all }
    test:
      targets: [CansTests, CansUITests]
  Cans E2E:
    build:
      targets: { Cans: all }
    test:
      targets: [CansTests, CansHardwareTests, CansUITests]
